      for (const m of view.modelTotals || []) if (costOf(m).unpricedTokens) cards.push(line(t('diagnosticsModel',{model:m.id,tokens:l.integer(costOf(m).unpricedTokens)}))); 
      cards.push(line(t('diagnosticsNode',{node:resolvedNode||t('nodePending'),zone:prefs.timeZone})));
      cards.push(line(t('diagnosticsReset',{day:l.weekday(prefs.resetDay),time:prefs.resetTime,count:l.integer(snapshot?.weeks?.length||0)})));
      cards.push(line(t('diagnosticsFiles',{found:l.integer(d.discoveredFiles||0),indexed:l.integer(d.indexedFiles||0),archived:l.integer(d.archivedFiles||0)})));
      cards.push(line(t('diagnosticsDuplicates',{duplicates:l.integer(d.duplicateCopies||0),malformed:l.integer(d.malformed||0),oversized:l.integer(d.oversized||0)})));
      cards.push(line(t('diagnosticsRecords',{weak:l.integer(d.weakIdentity||0),future:l.integer(d.futureRecords||0),agents:l.integer(d.subagentRequests||0)})));
      for (const root of snapshot?.roots||[]) cards.push(line(t('source',{path:root})));
      if (snapshot?.cacheDir) cards.push(line(t('index',{path:snapshot.cacheDir})));
      for (const warning of d.warnings||[]) cards.push(line(warning.code+': '+warning.path));
    }
    if (lastSuccess) cards.push(line(t('updated',{date:l.datetime(lastSuccess,prefs.timeZone,true)+' '+prefs.timeZone})));
    cards.push(line(t('historyHelp')));
    cards.push(line(t('categoriesHelp')));
    // Spacing belongs to the host layout, not to SVG viewBox padding or demo CSS.
    // Every section keeps a non-shrinking native row gap, including everything
    // below the selected-quota panel (API card, models, limits and footer).
    const sections=cards.map((child,index)=>Box({key:'section-'+index,flexDirection:'column',
      width:'100%',flexShrink:0,marginTop:index===0?0:1,children:[child]}));
    return Box({flexDirection:'column',width:'100%',paddingX:1,paddingBottom:1,backgroundColor:p.bg,children:sections});
  });
}

/** Regroup synthetic fixture counters at two explicit timestamps per day. */
function withDemoQuota(snapshot, options={}) {
  const clock=createQuotaClock({timeZone:options.timeZone||'Europe/Lisbon',resetDay:options.resetDay,resetTime:options.resetTime});
  const weeks=new Map(), byDate=new Map();
  for(const day of snapshot.days) {
    for(const [i,time] of ['08:00:00Z',day.date===snapshot.today?'14:00:00Z':'21:00:00Z'].entries()) {
      const timestamp=Date.parse(day.date+'T'+time), date=clock.dateAt(timestamp);
      const period=clock.periodAt(timestamp,date);
      if(!weeks.has(period.id)) weeks.set(period.id,{...period,byDate:new Map()});
      const wk=weeks.get(period.id);
      if(!wk.byDate.has(date))wk.byDate.set(date,new Map());
      if(!byDate.has(date))byDate.set(date,new Map());
      for(const model of day.models) {
        const values={};
        for(const k of ['read','write','input','output','requests']) values[k]=i===0?Math.floor(model[k]*.65):model[k]-Math.floor(model[k]*.65);
        // Synthetic per-request splits; never price a day as one Haiku prompt.
        values.cost=zeroCost();
        const requests=Math.max(1,values.requests);
        for(let r=0;r<requests;r++) {
          const rec={model:model.id,requests:1};
          for(const k of ['read','write','input','output']) rec[k]=Math.floor(values[k]/requests)+(r<values[k]%requests?1:0);
          // Most demonstration writes use 1h; a few missing TTLs illustrate ranges.
          if(Number(day.date.slice(-2))%11!==0) {rec.write1h=Math.floor(rec.write*.8);rec.write5m=rec.write-rec.write1h;}
          addCost(values.cost,priceRecord(rec));
        }
        for(const map of [wk.byDate.get(date),byDate.get(date)]) {
          if(!map.has(model.id)) map.set(model.id,{id:model.id,...zero()});
          addPriced(map.get(model.id),values);
        }
      }
    }
  }
  const toDays=map=>[...map].sort(([a],[b])=>a.localeCompare(b)).map(([date,models])=>({date,models:[...models.values()].sort((a,b)=>total(b)-total(a))}));
  const asOf=Date.parse(snapshot.generatedAt);
  return {...snapshot,pricing:pricingMetadata(),timeZone:clock.settings.timeZone,asOf,today:clock.dateAt(asOf),days:toDays(byDate),
    quota:{...clock.settings,signature:quotaSignature(clock.settings)},
    weeks:[...weeks.values()].sort((a,b)=>a.startMs-b.startMs).map(({byDate,...period})=>({...period,days:toDays(byDate)}))};
}
